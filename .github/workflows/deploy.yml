name: Deploy theme

# Deploys the theme to your Novinzo store on every push to main. Set the NOVINZO_STORE
# repository variable to your store's subdomain first (Settings → Secrets and variables →
# Actions → Variables). Settings → Theme in the Novinzo dashboard shows it, and is where you
# link this repository. No secret is needed: the deploy proves it runs for this repository
# with GitHub's OIDC token. The steps live in the action's repository, so they change with
# its releases and this file never has to.
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: emergente-labs/novinzo-theme-deploy/.github/workflows/deploy.yml@v1
    with:
      store: ${{ vars.NOVINZO_STORE }}
