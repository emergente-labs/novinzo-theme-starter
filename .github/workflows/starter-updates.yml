name: Starter updates

# Once a day, looks for a newer starter release of the major version theme.json extends,
# up to the one Novinzo serves, and opens a pull request taking it into the copies of the
# starter's files this theme keeps; the files it does not keep follow the starter on their
# own. Turn on Settings → Actions → General → "Allow GitHub Actions to create and approve
# pull requests" first. Run it from the Actions tab to look at once. The steps live in the
# action's repository, so they change with its releases and this file never has to.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: emergente-labs/novinzo-theme-deploy/.github/workflows/starter-updates.yml@v1
