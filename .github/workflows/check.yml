name: Check theme

# Has Novinzo check a pull request's theme the way a deploy would, without deploying it, so
# problems show as annotations before the change reaches main. It needs what the deploy
# needs: the NOVINZO_STORE repository variable, and this repository approved on the store's
# Settings → Theme. GitHub gives pull requests from forks no OIDC token, so they are skipped.
# The steps live in the action's repository, so they change with its releases and this file
# never has to.
on:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    uses: emergente-labs/novinzo-theme-deploy/.github/workflows/check.yml@v1
    with:
      store: ${{ vars.NOVINZO_STORE }}
