name: Check theme

# Has Novinzo check a pull request's theme the way a deploy would, without deploying it, so
# problems show as annotations before the change reaches main. It needs what the deploy
# needs: the NOVINZO_STORE repository variable, and this repository approved on the store's
# Settings → Theme. GitHub gives pull requests from forks no OIDC token, so they are skipped.
on:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    # The template itself checks against no store; repositories made from it do.
    if: >-
      github.repository != 'emergente-labs/novinzo-theme-starter' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: emergente-labs/novinzo-theme-deploy@v1
        with:
          store: ${{ vars.NOVINZO_STORE }}
          mode: check
