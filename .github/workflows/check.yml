name: Check theme

# Checks a pull request's theme the way a deploy would, without deploying it, so problems
# show as annotations before the change reaches main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: theme
      - uses: actions/checkout@v5
        with:
          repository: emergente-labs/novinzo-theme-deploy
          ref: v1
          path: novinzo-theme-deploy
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check
        working-directory: theme
